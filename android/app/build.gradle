apply plugin: 'com.android.application'

android {
    namespace = "com.kurostream.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kurostream.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 201
        versionName "2.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            def customKeystorePath = System.getenv('ANDROID_DEBUG_KEYSTORE_PATH')
            def repoDebugKeystore = project.file('debug.keystore')
            def sdkDebugKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def customKeystoreFile = customKeystorePath
                    ? (new File(customKeystorePath).isAbsolute()
                        ? new File(customKeystorePath)
                        : project.file(customKeystorePath))
                    : null
            def resolvedDebugKeystore = (customKeystoreFile != null && customKeystoreFile.exists())
                    ? customKeystoreFile
                    : (repoDebugKeystore.exists()
                        ? repoDebugKeystore
                        : (sdkDebugKeystore.exists() ? sdkDebugKeystore : null))

            if (resolvedDebugKeystore != null && resolvedDebugKeystore.exists()) {
                storeFile resolvedDebugKeystore
                storePassword System.getenv('ANDROID_DEBUG_STORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('ANDROID_DEBUG_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('ANDROID_DEBUG_KEY_PASSWORD') ?: 'android'
            }
        }
        release {
            def customReleasePath = System.getenv('ANDROID_RELEASE_KEYSTORE_PATH') ?: System.getenv('ANDROID_DEBUG_KEYSTORE_PATH')
            def repoReleaseKeystore = project.file('release.keystore')
            def repoDebugKeystore = project.file('debug.keystore')
            def sdkDebugKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def customReleaseFile = customReleasePath
                    ? (new File(customReleasePath).isAbsolute()
                        ? new File(customReleasePath)
                        : project.file(customReleasePath))
                    : null
            def resolvedReleaseKeystore = (customReleaseFile != null && customReleaseFile.exists())
                    ? customReleaseFile
                    : (repoReleaseKeystore.exists()
                        ? repoReleaseKeystore
                        : (repoDebugKeystore.exists()
                            ? repoDebugKeystore
                            : (sdkDebugKeystore.exists() ? sdkDebugKeystore : null)))

            if (resolvedReleaseKeystore != null && resolvedReleaseKeystore.exists()) {
                storeFile resolvedReleaseKeystore
                storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD') ?: (System.getenv('ANDROID_DEBUG_STORE_PASSWORD') ?: 'android')
                keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS') ?: (System.getenv('ANDROID_DEBUG_KEY_ALIAS') ?: 'androiddebugkey')
                keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD') ?: (System.getenv('ANDROID_DEBUG_KEY_PASSWORD') ?: 'android')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.exists() && servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
