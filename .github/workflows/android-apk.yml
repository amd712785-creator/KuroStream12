name: Build KuroStream Android Release & Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Optional Vercel/Express backend origin for /api/* routes (e.g. https://animeworldbd.vercel.app)'
        required: false
        default: 'https://animeworldbd.vercel.app'
        type: string

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build Release & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Ensure original gujhhgg-9de27 google-services.json is present in android/app
        run: |
          if [ ! -f android/app/google-services.json ] && [ -f public/assets/aistudio/google-services_48e0edfe.json ]; then
            cp public/assets/aistudio/google-services_48e0edfe.json android/app/google-services.json
            echo "Copied google-services.json from public/assets/aistudio/google-services_48e0edfe.json"
          fi

      - name: Verify google-services.json and Firebase project identity
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "Error: google-services.json missing in android/app/"
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const gs = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
            const client = gs.client?.find((c) => c.client_info?.android_client_info?.package_name === 'com.kurostream.app') || gs.client?.[0];
            const pkg = client?.client_info?.android_client_info?.package_name;
            if (pkg !== 'com.kurostream.app') {
              console.error('Invalid package_name:', pkg);
              process.exit(1);
            }
            const apiKey = client?.api_key?.[0]?.current_key;
            const appId = client?.client_info?.mobilesdk_app_id;
            if (!gs.project_info?.project_id || !apiKey || !appId) {
              console.error('Missing project_id, api_key, or mobilesdk_app_id in google-services.json');
              process.exit(1);
            }
            console.log('Android APK Firebase project_id:', gs.project_info.project_id, 'mobilesdk_app_id:', appId, 'package_name:', pkg);
          "

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_BACKEND_API_URL: ${{ github.event.inputs.backend_api_url || vars.VITE_BACKEND_API_URL || 'https://animeworldbd.vercel.app' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Cache persistent fallback keystore (only used when repository secret is absent)
        if: ${{ env.ANDROID_KEYSTORE_CACHE_DISABLED != 'true' }}
        uses: actions/cache@v4
        with:
          path: android/app/.ci-keystore-cache
          key: kurostream-android-keystore-v1

      - name: Configure persistent Android signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          DEBUG_KEYSTORE_PATH="android/app/debug.keystore"
          RELEASE_KEYSTORE_PATH="android/app/release.keystore"
          CACHED_KEYSTORE="android/app/.ci-keystore-cache/kurostream-shared.keystore"

          DEBUG_ALIAS="${ANDROID_DEBUG_KEY_ALIAS:-androiddebugkey}"
          export DEBUG_STORE_PASS="${ANDROID_DEBUG_STORE_PASSWORD:-android}"
          export DEBUG_KEY_PASS="${ANDROID_DEBUG_KEY_PASSWORD:-$DEBUG_STORE_PASS}"

          RELEASE_ALIAS="${ANDROID_RELEASE_KEY_ALIAS:-$DEBUG_ALIAS}"
          export RELEASE_STORE_PASS="${ANDROID_RELEASE_STORE_PASSWORD:-$DEBUG_STORE_PASS}"
          export RELEASE_KEY_PASS="${ANDROID_RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASS}"

          mkdir -p android/app "$(dirname "$CACHED_KEYSTORE")"

          STRIPPED_DEBUG_B64=$(printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" | tr -d '[:space:]')
          if [ -n "$STRIPPED_DEBUG_B64" ]; then
            printf '%s' "$STRIPPED_DEBUG_B64" | base64 -d > "$DEBUG_KEYSTORE_PATH"
            echo "Restored $DEBUG_KEYSTORE_PATH from ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f "$DEBUG_KEYSTORE_PATH" ] && [ -s "$DEBUG_KEYSTORE_PATH" ]; then
            echo "Using committed $DEBUG_KEYSTORE_PATH."
          elif [ -f "$CACHED_KEYSTORE" ] && [ -s "$CACHED_KEYSTORE" ]; then
            cp "$CACHED_KEYSTORE" "$DEBUG_KEYSTORE_PATH"
            echo "::warning::Restored keystore from GitHub Actions cache. Add ANDROID_DEBUG_KEYSTORE_BASE64 (or ANDROID_RELEASE_KEYSTORE_BASE64) to Repository Secrets to guarantee permanent update compatibility."
          else
            echo "::warning::No signing keystore secret found; generating fallback keystore. Future APK updates MUST reuse the exact same keystore secret so users do not have to uninstall."
            keytool -genkeypair \
              -keystore "$DEBUG_KEYSTORE_PATH" \
              -storetype PKCS12 \
              -storepass:env DEBUG_STORE_PASS \
              -alias "$DEBUG_ALIAS" \
              -keypass:env DEBUG_KEY_PASS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=KuroStream,O=KuroStream,C=US"
            cp "$DEBUG_KEYSTORE_PATH" "$CACHED_KEYSTORE"
          fi

          STRIPPED_RELEASE_B64=$(printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" | tr -d '[:space:]')
          if [ -n "$STRIPPED_RELEASE_B64" ]; then
            printf '%s' "$STRIPPED_RELEASE_B64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
            echo "Restored $RELEASE_KEYSTORE_PATH from ANDROID_RELEASE_KEYSTORE_BASE64 secret."
          else
            cp "$DEBUG_KEYSTORE_PATH" "$RELEASE_KEYSTORE_PATH"
            echo "Using persistent shared keystore for release signing ($RELEASE_KEYSTORE_PATH)."
          fi

          keytool -list -v -keystore "$RELEASE_KEYSTORE_PATH" -alias "$RELEASE_ALIAS" -storepass:env RELEASE_STORE_PASS

      - name: Build Android Release & Debug APKs
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ github.workspace }}/android/app/debug.keystore
          ANDROID_DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          ANDROID_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
          ANDROID_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Verify APK Signing Certificates & Version Code
        if: success()
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER_BIN=$(find "$SDK_ROOT/build-tools" -maxdepth 2 \( -type f -o -type l \) -name "apksigner" | sort -V | tail -n 1)
          for APK_PATH in "android/app/build/outputs/apk/release/app-release.apk" "android/app/build/outputs/apk/debug/app-debug.apk"; do
            if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
              echo "Error: Expected APK not found at $APK_PATH"
              exit 1
            fi
            echo "Verifying $APK_PATH"
            "$APKSIGNER_BIN" verify --print-certs "$APK_PATH"
          done

      - name: Upload KuroStream Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurostream-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload KuroStream Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurostream-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
