name: Build KuroStream Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Optional Vercel/Express backend origin for /api/* routes (e.g. https://animeworldbd.vercel.app)'
        required: false
        default: 'https://animeworldbd.vercel.app'
        type: string

permissions:
  contents: read

jobs:
  build-android-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_BACKEND_API_URL: ${{ github.event.inputs.backend_api_url || vars.VITE_BACKEND_API_URL || 'https://animeworldbd.vercel.app' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Ensure uploaded google-services.json is present in android/app
        run: |
          if [ ! -f android/app/google-services.json ]; then
            if [ -f public/assets/aistudio/google-services_48e0edfe.json ]; then
              cp public/assets/aistudio/google-services_48e0edfe.json android/app/google-services.json
              echo "Copied uploaded google-services.json from public/assets/aistudio/google-services_48e0edfe.json to android/app/google-services.json"
            else
              FOUND_GS=$(find public -maxdepth 4 -name "google-services*.json" -type f | head -n 1)
              if [ -n "$FOUND_GS" ]; then
                cp "$FOUND_GS" android/app/google-services.json
                echo "Copied uploaded google-services.json from $FOUND_GS to android/app/google-services.json"
              fi
            fi
          fi

      - name: Verify google-services.json and Firebase OAuth alignment
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found successfully."
            node -e "
              const fs = require('fs');
              const gs = JSON.parse(fs.readFileSync('android/app/google-services.json', 'utf8'));
              const client = gs.client?.[0];
              const pkg = client?.client_info?.android_client_info?.package_name;
              if (pkg !== 'com.kurostream.app') {
                console.error('Invalid package_name:', pkg);
                process.exit(1);
              }
              const oauthClients = Array.isArray(client?.oauth_client) ? client.oauth_client : [];
              const androidClients = oauthClients.filter((c) => c.client_type === 1);
              const webClients = oauthClients.filter((c) => c.client_type === 3);
              console.log('Verified package_name:', pkg, 'google-services project_id:', gs.project_info?.project_id);
              console.log('google-services oauth_client counts -> Android(type=1):', androidClients.length, 'Web(type=3):', webClients.length);
              if (androidClients.length === 0) {
                console.log('::warning::android/app/google-services.json has 0 Android OAuth clients (client_type=1). Add your APK SHA-1 and SHA-256 in Firebase Console and re-download google-services.json.');
              }
              if (fs.existsSync('firebase-applet-config.json')) {
                const webCfg = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));
                console.log('firebase-applet-config projectId:', webCfg.projectId, 'oAuthClientId:', webCfg.oAuthClientId || '(unset)');
                if (gs.project_info?.project_id !== webCfg.projectId) {
                  console.log('::warning::Project mismatch: google-services.json project_id (' + gs.project_info?.project_id + ') != firebase-applet-config.json projectId (' + webCfg.projectId + '). Android Credential Manager requires an Android OAuth client (package + APK SHA-1) in the SAME project as webClientId (' + webCfg.oAuthClientId + ').');
                }
              }
            "
          else
            echo "Error: google-services.json missing in android/app/"
            exit 1
          fi

      - name: Configure deterministic Android debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
            echo "Restored android/app/debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret."
          else
            echo "Using repository android/app/debug.keystore."
          fi
          keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Print APK Signing SHA-1 / SHA-256 Fingerprints
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload KuroStream Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurostream-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
