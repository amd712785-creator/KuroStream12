name: Build KuroStream Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      backend_api_url:
        description: 'Optional Vercel/Express backend origin for /api/* routes (e.g. https://animeworldbd.vercel.app)'
        required: false
        default: 'https://animeworldbd.vercel.app'
        type: string

permissions:
  contents: read

jobs:
  build-android-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run lint

      - name: Build production web bundle
        env:
          VITE_BACKEND_API_URL: ${{ github.event.inputs.backend_api_url || vars.VITE_BACKEND_API_URL || 'https://animeworldbd.vercel.app' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify google-services.json for Firebase Android
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found successfully."
          else
            echo "Error: google-services.json missing in android/app/"
            exit 1
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload KuroStream Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kurostream-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
